name: Deploy to GitHub Pages

# GitHub Pages serves files, and this repo holds Astro source — so something has
# to run `astro build` and publish `dist/`. That is what this does, on every
# push to main.
on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# The permissions the deploy-pages action needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys publish at once, but don't cancel one mid-flight either.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # This repo is a project page, so the site lives under /Prepyo-Online/
          # rather than at the domain root. Both are read at build time.
          PUBLIC_SITE_URL: https://saurabhthakulla.github.io
          PUBLIC_BASE_PATH: /Prepyo-Online
          # Where the "Sign up" / "Login" links point. Overridable with a repo
          # variable; otherwise src/consts.ts falls back to the same production
          # URL, so there is only one place to change it.
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://dashboard.prepyo.online' }}
          # The pricing section fetches plans from here. It stays hidden until
          # the app's BACKEND_URL points at the deployed Go service and that
          # service lists this site's origin in ALLOWED_ORIGINS.
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://dashboard.prepyo.online/api/v1' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
